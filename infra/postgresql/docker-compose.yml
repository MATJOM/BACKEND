services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: db-postgis
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: matjom_dev
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pg-data: {}

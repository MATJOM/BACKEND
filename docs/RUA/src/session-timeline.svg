<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360">
  <style>
    .axis { stroke: #222; stroke-width: 2; }
    .tick { stroke: #555; stroke-width: 1; }
    .label { font: 12px Arial, sans-serif; fill: #111; }
    .title { font: 16px Arial, sans-serif; font-weight: bold; fill: #111; }
    .bar { stroke: #333; stroke-width: 12; stroke-linecap: round; }
    .zone { fill: rgba(0, 128, 0, 0.08); stroke: #2a7; stroke-width: 1; stroke-dasharray: 4 3; }
    .event { font: 12px Arial, sans-serif; fill: #0a5; }
  </style>

  <text class="title" x="20" y="30">Timeline — From START to ARRIVED</text>

  <!-- Time axis -->
  <line class="axis" x1="80" y1="100" x2="900" y2="100"/>
  <!-- ticks 12:00 to 12:18 every 2 minutes -->
  <g>
    <line class="tick" x1="120" y1="95" x2="120" y2="105"/><text class="label" x="120" y="120" text-anchor="middle">12:00</text>
    <line class="tick" x1="200" y1="95" x2="200" y2="105"/><text class="label" x="200" y="120" text-anchor="middle">12:02</text>
    <line class="tick" x1="280" y1="95" x2="280" y2="105"/><text class="label" x="280" y="120" text-anchor="middle">12:04</text>
    <line class="tick" x1="360" y1="95" x2="360" y2="105"/><text class="label" x="360" y="120" text-anchor="middle">12:06</text>
    <line class="tick" x1="440" y1="95" x2="440" y2="105"/><text class="label" x="440" y="120" text-anchor="middle">12:08</text>
    <line class="tick" x1="520" y1="95" x2="520" y2="105"/><text class="label" x="520" y="120" text-anchor="middle">12:10</text>
    <line class="tick" x1="600" y1="95" x2="600" y2="105"/><text class="label" x="600" y="120" text-anchor="middle">12:12</text>
    <line class="tick" x1="680" y1="95" x2="680" y2="105"/><text class="label" x="680" y="120" text-anchor="middle">12:14</text>
    <line class="tick" x1="760" y1="95" x2="760" y2="105"/><text class="label" x="760" y="120" text-anchor="middle">12:16</text>
    <line class="tick" x1="840" y1="95" x2="840" y2="105"/><text class="label" x="840" y="120" text-anchor="middle">12:18</text>
  </g>

  <!-- navigation 30s positions (visualized as bar) -->
  <line class="bar" x1="120" y1="180" x2="900" y2="180" stroke="#888"/>
  <text class="label" x="110" y="185">positions(30s)</text>

  <!-- 30m radius dwell window from 12:08 to 12:11 -->
  <rect x="440" y="150" width="180" height="60" class="zone"/>
  <text class="event" x="530" y="145" text-anchor="middle">inside 30m radius</text>
  <text class="label" x="440" y="225">12:08</text>
  <text class="label" x="620" y="225">12:11</text>
  <text class="event" x="530" y="240" text-anchor="middle">dwell = 180s</text>

  <!-- markers -->
  <circle cx="440" cy="180" r="5" fill="#0a5"/>
  <text class="event" x="440" y="140" text-anchor="middle">ENTER</text>
  <circle cx="620" cy="180" r="5" fill="#0a5"/>
  <text class="event" x="620" y="140" text-anchor="middle">ARRIVED</text>
</svg>

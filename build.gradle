plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.matjom'
version = '0.0.1-SNAPSHOT'
description = 'MATJOM - 오늘은 또 뭐 먹지...'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // ======= Spring 기본 스타터 =======
    implementation 'org.springframework.boot:spring-boot-starter-web'          // REST API 개발
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'     // JPA/Hibernate ORM
    implementation 'org.springframework.boot:spring-boot-starter-security'     // 보안(JWT, OAuth 연동)
    implementation 'org.springframework.boot:spring-boot-starter-validation'   // DTO 입력값 검증(@NotBlank 등)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'   // Redis (토큰 저장, 캐싱)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'     // 모니터링/헬스체크

    // ======= DB 드라이버 =======
    runtimeOnly 'org.postgresql:postgresql'   // 운영 DB (Postgresql)
    runtimeOnly 'com.h2database:h2'           // 로컬 개발용 인메모리 DB

    implementation 'org.hibernate.orm:hibernate-spatial'
    implementation 'org.locationtech.jts:jts-core:1.19.0'

    // ======= 개발 편의 =======
    compileOnly 'org.projectlombok:lombok'                       // Getter/Setter/Builder 자동 생성
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools' // 코드 변경 시 자동 리스타트

    // ======= JWT =======
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'      // JWT 생성/검증 API
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'        // JWT 내부 구현체
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'     // JWT 파싱/직렬화(Jackson 연동)

    // ======= DB 마이그레이션 (Flyway) =======
    //implementation 'org.flywaydb:flyway-core'    // DB 버전 관리

    // ======= API 문서화 (Swagger/OpenAPI) =======
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0' // Swagger UI 제공

    // ======= 로깅 (Logstash Encoder) =======
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4' // JSON 로그 포맷 (ELK 연동)

    // ====== 모니터링/메트릭 ======
    implementation 'io.micrometer:micrometer-core'                  //애플리케이션에서 메트릭 수집
    implementation 'io.micrometer:micrometer-registry-prometheus'   //Prometheus에 메트릭을 노출하기 위한 어댑터

    // ======= 테스트 =======
    testImplementation 'org.springframework.boot:spring-boot-starter-test' // JUnit5 + MockMvc
    testImplementation 'org.springframework.security:spring-security-test' // 인증/인가 테스트
    testImplementation 'org.mockito:mockito-core'                          // Mock 객체 생성
    testImplementation 'org.assertj:assertj-core:3.26.0'                   // 가독성 좋은 검증
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'            // JUnit 플랫폼 런처
    testImplementation 'org.testcontainers:junit-jupiter:1.20.0'
    testImplementation 'org.testcontainers:postgresql:1.20.0'

    // ====== Argon2 라이브러리 ======
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ======= UTF-8 인코딩 강제 =======
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // 소스 코드 인코딩을 UTF-8로 고정
}

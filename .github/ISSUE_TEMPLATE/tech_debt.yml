name: "🧹 Tech debt / Refactor"
title: "[#<이슈번호>] refactor(<scope>): <개선 요약>"
description: "품질 개선/리팩터/빌드/성능 등"
labels: [tech-debt]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ### 제목/브랜치 예시
        - 제목: `[#410] refactor(jpa): N+1 제거 및 fetch join 적용`
        - 브랜치: `refactor/410-jpa-nplusone`
  - type: textarea
    id: context
    attributes:
      label: 컨텍스트
  - type: textarea
    id: proposal
    attributes:
      label: 제안(대안 포함)
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건(AC)
      placeholder: |
        - [ ] 빌드/테스트 그린
        - [ ] 성능 회귀 없음
        - [ ] 문서/런북 업데이트
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options: [P0, P1, P2, P3]
      default: 2

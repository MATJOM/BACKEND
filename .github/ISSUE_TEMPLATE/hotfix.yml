name: "🔥 Hotfix request"
title: "hotfix: <X.Y.Z+1> - <요약>"
description: "운영 긴급 수정"
labels: [hotfix]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ### 브랜치 예시
        - `hotfix/1.3.1-rate-limit`
  - type: input
    id: impact
    attributes:
      label: 영향/심각도
  - type: textarea
    id: scope
    attributes:
      label: 수정 범위
  - type: textarea
    id: test
    attributes:
      label: 테스트/검증
  - type: checkboxes
    id: checklist
    attributes:
      label: 체크리스트
      options:
        - label: main에서 hotfix 분기
          required: true
        - label: CI 그린 + 리뷰 1+
          required: true
        - label: 머지 후 태그 vX.Y.Z+1
          required: true
        - label: develop 동기화(병합 또는 체리픽)
          required: true
